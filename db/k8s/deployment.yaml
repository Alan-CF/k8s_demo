apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: restaurant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: restaurant
            - name: POSTGRES_USER
              value: restaurant
            - name: POSTGRES_PASSWORD
              value: devpassword
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
