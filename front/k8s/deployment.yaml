apiVersion: apps/v1
kind: Deployment
metadata:
  name: react
  namespace: restaurant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
        - name: react
          image: your-registry/myapp-frontend:1.0.0
          ports:
            - containerPort: 80
