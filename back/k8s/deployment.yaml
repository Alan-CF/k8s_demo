apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: restaurant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
        - name: django
          image: your-registry/myapp-backend:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "config.settings.production"
            - name: DEBUG
              value: "0"
            - name: SECRET_KEY
              value: "change-me"
            - name: DATABASE_URL
              value: "postgres://user:pass@postgres:5432/myapp"
