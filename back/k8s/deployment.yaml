apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: restaurant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
        - name: django
          image: restaurant-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          env:
            - name: POSTGRES_DB
              value: restaurant
            - name: POSTGRES_USER
              value: restaurant
            - name: POSTGRES_PASSWORD
              value: devpassword
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: SECRET_KEY
              value: "change-me"
