apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  namespace: restaurant
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: restaurant-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "python", "manage.py", "migrate", "--noinput"]
          env:
            - name: POSTGRES_DB
              value: restaurant
            - name: POSTGRES_USER
              value: restaurant
            - name: POSTGRES_PASSWORD
              value: devpassword
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: SECRET_KEY
              value: "change-me"
