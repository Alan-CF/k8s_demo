apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-django
  namespace: restaurant
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: django
                port:
                  number: 8000
